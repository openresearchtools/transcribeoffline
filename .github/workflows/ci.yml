name: Build Linux

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release assets after the Linux build"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as pre-release"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Release tag (X.Y or X.Y.Z). Empty uses the Cargo package version."
        required: false
        default: ""
        type: string
      release_name:
        description: "Release title. Empty uses the release tag."
        required: false
        default: ""
        type: string
      non_linux_source_tag:
        description: "Existing release tag to copy Windows/macOS assets from. Empty uses the latest published release."
        required: false
        default: ""
        type: string

jobs:
  build-linux:
    name: linux-x64-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            dpkg-dev \
            desktop-file-utils \
            alsa-utils \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Verify bundled legal documents
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            licenses/THIRD_PARTY_NOTICES_ALL.md \
            licenses/THIRD_PARTY_LICENSES_ALL.md \
            licenses/ENGINE_THIRD_PARTY_LICENSES_FULL.md; do
            test -s "$path"
          done

      - name: Run complete Linux test suite
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-test-target
        run: cargo test --locked

      - name: Build Debian package
        shell: bash
        run: |
          chmod +x build/package-linux-deb.sh
          build/package-linux-deb.sh \
            --output-dir "$GITHUB_WORKSPACE/artifacts/deb" \
            --target-dir "${{ runner.temp }}/cargo-release-target"

      - name: Verify Debian package metadata
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find artifacts/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "transcribe-offline"
          test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"
          depends="$(dpkg-deb -f "$deb" Depends)"
          grep -qw openresearchtools-engine <<<"$depends"
          grep -qw openresearchtools-engine-cuda <<<"$depends"
          grep -qw alsa-utils <<<"$depends"
          package_root="${RUNNER_TEMP}/transcribe-offline-package"
          dpkg-deb --extract "$deb" "$package_root"
          desktop="$package_root/usr/share/applications/transcribe-offline.desktop"
          test -x "$package_root/usr/lib/transcribe-offline/transcribe-offline"
          test -L "$package_root/usr/bin/transcribe-offline"
          test "$(readlink "$package_root/usr/bin/transcribe-offline")" = \
            "../lib/transcribe-offline/transcribe-offline"
          test -s "$package_root/usr/share/icons/hicolor/256x256/apps/transcribe-offline.png"
          grep -Fx 'Name=Transcribe Offline' "$desktop"
          grep -Fx 'Exec=transcribe-offline' "$desktop"
          grep -Fx 'Icon=transcribe-offline' "$desktop"
          grep -Fx 'StartupWMClass=transcribe-offline' "$desktop"
          grep -Fx 'Categories=AudioVideo;Audio;' "$desktop"
          if grep -q '^MimeType=' "$desktop"; then
            echo "Do not advertise MIME ownership until command-line file activation is implemented." >&2
            exit 1
          fi
          desktop-file-validate "$desktop"
          if dpkg-deb --contents "$deb" | grep -q '/opt/openresearchtools/engine/'; then
            echo "The app package must not bundle an engine runtime." >&2
            exit 1
          fi

      - name: Upload Linux Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb
          path: artifacts/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release Assets
    if: ${{ inputs.publish_release == true }}
    needs: build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-deb
          path: release-input/linux

      - name: Resolve release metadata
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const cargo = fs.readFileSync("Cargo.toml", "utf8");
            const packageVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const requested = `${{ inputs.release_tag }}`.trim();
            const tag = (requested || packageVersion || "").replace(/^v/, "");
            const match = tag.match(/^(\d+)\.(\d+)(?:\.(\d+))?$/);
            if (!match) {
              core.setFailed(`Invalid release tag/version '${tag}'. Use X.Y or X.Y.Z.`);
              return;
            }
            const version = `${match[1]}.${match[2]}.${match[3] || "0"}`;
            const requestedName = `${{ inputs.release_name }}`.trim();
            core.setOutput("tag", tag);
            core.setOutput("version", version);
            core.setOutput("name", requestedName || tag);

      - name: Carry forward Windows and macOS assets
        id: carry
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_TAG: ${{ inputs.non_linux_source_tag }}
        shell: bash
        run: |
          set -euo pipefail
          source_tag="$REQUESTED_SOURCE_TAG"
          if [[ -z "$source_tag" ]]; then
            source_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          if [[ "${source_tag#v}" == '${{ steps.meta.outputs.tag }}' ]]; then
            echo "The carried-asset source must be the previous release, not the target release." >&2
            exit 1
          fi
          mkdir -p release-assets
          gh release download "$source_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern 'Transcribe-Offline-windows-x64.exe' \
            --pattern 'transcribe-offline-macos-arm64.dmg' \
            --clobber
          test -s release-assets/Transcribe-Offline-windows-x64.exe
          test -s release-assets/transcribe-offline-macos-arm64.dmg
          {
            echo "NON_LINUX_WINDOWS_SHA256=$(sha256sum release-assets/Transcribe-Offline-windows-x64.exe | awk '{print $1}')"
            echo "NON_LINUX_MACOS_SHA256=$(sha256sum release-assets/transcribe-offline-macos-arm64.dmg | awk '{print $1}')"
          } >> "$GITHUB_ENV"
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare versioned Linux package and checksums
        shell: bash
        run: |
          set -euo pipefail
          input_deb="$(find release-input/linux -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$input_deb"
          extract_root="${RUNNER_TEMP}/transcribe-offline-deb-extract"
          dpkg-deb --extract "$input_deb" "$extract_root"
          chmod +x build/package-linux-deb.sh
          build/package-linux-deb.sh \
            --binary "$extract_root/usr/lib/transcribe-offline/transcribe-offline" \
            --version "${{ steps.meta.outputs.version }}" \
            --output-dir "$GITHUB_WORKSPACE/release-assets" \
            --target-dir "${RUNNER_TEMP}/unused-cargo-target"
          (cd release-assets && sha256sum \
            Transcribe-Offline-windows-x64.exe \
            transcribe-offline-macos-arm64.dmg \
            "transcribe-offline_${{ steps.meta.outputs.version }}_amd64.deb" \
            > SHA256SUMS.txt)

      - name: Build release page body
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          version="${{ steps.meta.outputs.version }}"
          source_tag="${{ steps.carry.outputs.source_tag }}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          linux_asset="transcribe-offline_${version}_amd64.deb"

          cat > release-body.md <<RELEASE_BODY
          ## Downloads

          - Linux x64: [\`${linux_asset}\`](${base_url}/${linux_asset})
          - Windows x64*: [\`Transcribe-Offline-windows-x64.exe\`](${base_url}/Transcribe-Offline-windows-x64.exe)
          - macOS arm64*: [\`transcribe-offline-macos-arm64.dmg\`](${base_url}/transcribe-offline-macos-arm64.dmg)
          - Checksums: [\`SHA256SUMS.txt\`](${base_url}/SHA256SUMS.txt)

          \* Windows and macOS binaries are carried forward unchanged from release \`${source_tag}\`.
          RELEASE_BODY

          if [[ "${{ inputs.prerelease }}" != "true" ]]; then
            cat >> release-body.md <<RELEASE_BODY

          <!-- openresearchtools-apt-install:start -->
          ## Install on Debian 13+ or Ubuntu 24.04/26.04+ (amd64)

          For the first Open Research Tools installation on this system:

          \`\`\`bash
          wget -qO /tmp/keyring.deb https://keyring.openresearchtools.com && sudo apt install -y /tmp/keyring.deb && sudo apt update && sudo apt install -y transcribe-offline=${version}
          \`\`\`

          If the Open Research Tools APT repository is already configured:

          \`\`\`bash
          sudo apt update && sudo apt install -y transcribe-offline=${version}
          \`\`\`

          APT installs both required Engine variants automatically.
          <!-- openresearchtools-apt-install:end -->
          RELEASE_BODY
          fi

          cat >> release-body.md <<RELEASE_BODY

          The Vulkan/CUDA selector in Settings uses the corresponding installed runtime under
          \`/opt/openresearchtools/engine/vulkan\` or \`/opt/openresearchtools/engine/cuda\`.
          Linux never downloads or replaces the engine from inside the app.

          ## Unsigned build notice

          These artifacts may be unsigned. Review checksums and your local security policy before use.
          RELEASE_BODY

      - name: Verify retained assets are byte-for-byte preserved
        shell: bash
        run: |
          set -euo pipefail
          windows_sha="$(sha256sum release-assets/Transcribe-Offline-windows-x64.exe | awk '{print $1}')"
          macos_sha="$(sha256sum release-assets/transcribe-offline-macos-arm64.dmg | awk '{print $1}')"
          test "$windows_sha" = "$NON_LINUX_WINDOWS_SHA256"
          test "$macos_sha" = "$NON_LINUX_MACOS_SHA256"
          echo "Windows asset preserved byte-for-byte: $windows_sha"
          echo "macOS asset preserved byte-for-byte: $macos_sha"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ inputs.prerelease == true }}
          files: release-assets/*
          body_path: release-body.md
          generate_release_notes: false
